[package]
name = "tof"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[workspace]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
colored = "2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

[build-dependencies]
anyhow = "1"
# Build-time only: parses the vendored walle chip.schema (a Python pickle of
# the chip register hierarchy). Pinned to an exact alpha because it is the
# only pickle crate that preserves pickled class instances (Value::Object
# with attribute state) and tolerates the schema's parent-pointer cycles;
# upstream serde-pickle silently drops object state.
pickled = "=2.0.0-alpha9"
proc-macro2 = "1"
quote = "1"
